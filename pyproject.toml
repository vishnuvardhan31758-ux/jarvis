[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "5.0.0"
description = "JARVIS 5.0 — Autonomous Personal AI Operating System (Windows + macOS + Global Remote)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=7.4.0",
]

[project.scripts]
jarvis = "jarvis.main:cli_entrypoint"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
